name: Validate LZA Configuration PR

on:
  pull_request:
    branches: [main]
    paths:
      - '**.yaml'
      - '**.yml'
      - '**.json'
      - 'scripts/validate-config-pr.sh'
      - 'buildspec.yml'

# Auto-cancel in-progress runs for the same PR when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-lza-pr:
    name: Package & Run CodeBuild Pre-Check
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      # CodeBuild project name. Defaults to the LZA-native name; override via secret
      # if you deployed with a custom AcceleratorPrefix.
      CODEBUILD_PROJECT: ${{ secrets.CODEBUILD_PROJECT || 'AWSAccelerator-ConfigValidator' }}

    steps:
      - name: Checkout PR Configuration Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Zip PR Configuration Files
        run: |
          zip -q -r pr-config.zip . -x "*.git*"

      - name: Upload PR Zip to S3
        id: upload
        run: |
          S3_KEY="prs/${{ github.event.pull_request.number }}/${{ github.sha }}.zip"
          aws s3 cp pr-config.zip "s3://${{ env.S3_BUCKET }}/${S3_KEY}" --only-show-errors
          echo "s3_location=${{ env.S3_BUCKET }}/${S3_KEY}" >> $GITHUB_OUTPUT

      - name: Execute AWS CodeBuild Validation
        id: codebuild
        run: |
          BUILD_ID=$(aws codebuild start-build \
            --project-name "${CODEBUILD_PROJECT}" \
            --source-type-override S3 \
            --source-location-override "${{ env.S3_BUCKET }}/prs/${{ github.event.pull_request.number }}/${{ github.sha }}.zip" \
            --query 'build.id' --output text)
          echo "build_id=${BUILD_ID}" >> $GITHUB_OUTPUT
          echo "Started CodeBuild: ${BUILD_ID}"

          # Get log group/stream info
          LOG_GROUP="/aws/codebuild/${CODEBUILD_PROJECT}"
          LOG_STREAM=$(echo "${BUILD_ID}" | cut -d: -f2)
          NEXT_TOKEN=""

          # Poll until build completes, streaming logs
          while true; do
            STATUS=$(aws codebuild batch-get-builds --ids "${BUILD_ID}" --query 'builds[0].buildStatus' --output text)

            # Stream available log events
            if [ -z "${NEXT_TOKEN}" ]; then
              LOG_OUTPUT=$(aws logs get-log-events \
                --log-group-name "${LOG_GROUP}" \
                --log-stream-name "${LOG_STREAM}" \
                --start-from-head \
                --output json 2>/dev/null || echo '{"events":[],"nextForwardToken":""}')
            else
              LOG_OUTPUT=$(aws logs get-log-events \
                --log-group-name "${LOG_GROUP}" \
                --log-stream-name "${LOG_STREAM}" \
                --next-token "${NEXT_TOKEN}" \
                --start-from-head \
                --output json 2>/dev/null || echo '{"events":[],"nextForwardToken":""}')
            fi

            # Print new log lines
            echo "${LOG_OUTPUT}" | jq -r '.events[].message // empty' 2>/dev/null | while IFS= read -r line; do
              echo "  ${line}"
            done

            NEW_TOKEN=$(echo "${LOG_OUTPUT}" | jq -r '.nextForwardToken // empty' 2>/dev/null)
            if [ -n "${NEW_TOKEN}" ]; then
              NEXT_TOKEN="${NEW_TOKEN}"
            fi

            if [ "${STATUS}" != "IN_PROGRESS" ]; then
              echo ""
              echo "Build finished with status: ${STATUS}"
              if [ "${STATUS}" != "SUCCEEDED" ]; then
                echo "::error::CodeBuild validation failed with status: ${STATUS}"
                exit 1
              fi
              break
            fi
            sleep 10
          done
