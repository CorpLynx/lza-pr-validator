AWSTemplateFormatVersion: '2010-09-09'
Description: 'S3 + CodeBuild validation engine with caching for LZA PR checks'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: LZA Settings
        Parameters:
          - pLZAVersion
          - pAcceleratorResourcePrefix
          - pAcceleratorSsmPrefix
          - pCrossAccountRoleName
      - Label:
          default: Resource Names (leave blank to auto-generate where supported)
        Parameters:
          - pValidationBucketName
          - pSourceBucketName
          - pValidationProjectName
          - pSourceBuilderProjectName
          - pCodeBuildRoleName
          - pSynthRoleName
          - pSourceBuilderRoleName
          - pGitHubActionsUserName
          - pCredentialsSecretName
      - Label:
          default: Compute & Retention
        Parameters:
          - pValidationComputeType
          - pSourceBuilderComputeType
          - pPRZipRetentionDays

Parameters:
  pLZAVersion:
    Type: String
    Default: 'v1.16.0'
    Description: 'Release tag of awslabs/landing-zone-accelerator-on-aws to validate against'

  pAcceleratorResourcePrefix:
    Type: String
    Default: 'AWSAccelerator'
    Description: 'Resource name prefix LZA uses (scopes DynamoDB config table access). Match the AcceleratorPrefix from your LZA installer.'

  pAcceleratorSsmPrefix:
    Type: String
    Default: 'accelerator'
    Description: 'SSM parameter path prefix LZA uses (without leading slash). Scopes SSM read access.'

  pCrossAccountRoleName:
    Type: String
    Default: 'AWSControlTowerExecution'
    Description: 'Name of the cross-account role the synth step assumes in member accounts (e.g. AWSControlTowerExecution or OrganizationAccountAccessRole).'

  pValidationBucketName:
    Type: String
    Default: ''
    Description: 'Name for the PR validation S3 bucket. Leave blank to auto-generate.'

  pSourceBucketName:
    Type: String
    Default: ''
    Description: 'Name for the LZA source S3 bucket. Leave blank to auto-generate.'

  pValidationProjectName:
    Type: String
    Default: 'LZA-PR-Validator'
    Description: 'Name for the validation CodeBuild project.'

  pSourceBuilderProjectName:
    Type: String
    Default: 'LZA-Source-Builder'
    Description: 'Name for the source-builder CodeBuild project.'

  pCodeBuildRoleName:
    Type: String
    Default: 'LZA-PR-Validator-CodeBuild-Role'
    Description: 'Name for the validation CodeBuild service role.'

  pSynthRoleName:
    Type: String
    Default: 'LZA-PR-Validator-Synth-Role'
    Description: 'Name for the CDK synth role (elevated read-only access).'

  pSourceBuilderRoleName:
    Type: String
    Default: 'LZA-Source-Builder-Role'
    Description: 'Name for the source-builder CodeBuild service role.'

  pGitHubActionsUserName:
    Type: String
    Default: 'GHA-LZA-PR-Validator-User'
    Description: 'Name for the GitHub Actions IAM user.'

  pCredentialsSecretName:
    Type: String
    Default: 'lza-pr-validator/github-actions-credentials'
    Description: 'Secrets Manager secret name storing the GitHub Actions access key and secret.'

  pValidationComputeType:
    Type: String
    Default: 'BUILD_GENERAL1_MEDIUM'
    AllowedValues:
      - BUILD_GENERAL1_SMALL
      - BUILD_GENERAL1_MEDIUM
      - BUILD_GENERAL1_LARGE
    Description: 'Compute size for validation runs (pre-built bundle needs MEDIUM or higher).'

  pSourceBuilderComputeType:
    Type: String
    Default: 'BUILD_GENERAL1_LARGE'
    AllowedValues:
      - BUILD_GENERAL1_MEDIUM
      - BUILD_GENERAL1_LARGE
      - BUILD_GENERAL1_2XLARGE
    Description: 'Compute size for the source builder (compiles 128 packages; needs LARGE or higher).'

  pPRZipRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    Description: 'Days to retain uploaded PR config zips before lifecycle expiry.'

Conditions:
  HasValidationBucketName: !Not [!Equals [!Ref pValidationBucketName, '']]
  HasSourceBucketName: !Not [!Equals [!Ref pSourceBucketName, '']]

Resources:
  PRValidationBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If [HasValidationBucketName, !Ref pValidationBucketName, !Ref 'AWS::NoValue']
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: CleanUpOldPrZips
            Status: Enabled
            ExpirationInDays: !Ref pPRZipRetentionDays
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  PRValidationBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PRValidationBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceTLSRequestsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub '${PRValidationBucket.Arn}'
              - !Sub '${PRValidationBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  LZASourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If [HasSourceBucketName, !Ref pSourceBucketName, !Ref 'AWS::NoValue']
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  LZASourceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LZASourceBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceTLSRequestsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub '${LZASourceBucket.Arn}'
              - !Sub '${LZASourceBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  CodeBuildValidatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref pCodeBuildRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LZAValidatorPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub '${PRValidationBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                Resource:
                  - !Sub '${LZASourceBucket.Arn}'
                  - !Sub '${LZASourceBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'
              - Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${pSynthRoleName}'

  LZAValidatorSynthRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref pSynthRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${pCodeBuildRoleName}'
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LZASynthPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: OrganizationsReadOnly
                Effect: Allow
                Action:
                  - organizations:ListAccounts
                  - organizations:DescribeOrganization
                  - organizations:DescribeAccount
                  - organizations:ListRoots
                  - organizations:ListOrganizationalUnitsForParent
                  - organizations:ListChildren
                  - organizations:ListAccountsForParent
                Resource: '*'
              - Sid: DynamoDBConfigTable
                Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:GetItem
                  - dynamodb:DescribeTable
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${pAcceleratorResourcePrefix}-*'
              - Sid: SSMParameterRead
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/${pAcceleratorSsmPrefix}/*'
                  - !Sub 'arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/cdk-bootstrap/*'
              - Sid: KMSDecrypt
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:GenerateDataKey
                Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
              - Sid: STSIdentity
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: '*'
              - Sid: EC2DescribeRegions
                Effect: Allow
                Action:
                  - ec2:DescribeRegions
                  - ec2:DescribeAvailabilityZones
                Resource: '*'
              - Sid: CrossAccountAccess
                Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::*:role/${pCrossAccountRoleName}'

  LZAValidationProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Ref pValidationProjectName
      Description: 'Validates LZA PR configs from S3 archive using yamllint, validate-config, and concurrent cdk synth'
      ServiceRole: !GetAtt CodeBuildValidatorRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Cache:
        Type: LOCAL
        Modes:
          - LOCAL_SOURCE_CACHE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: !Ref pValidationComputeType
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: LZA_VERSION
            Value: !Ref pLZAVersion
          - Name: LZA_SOURCE_BUCKET
            Value: !Ref LZASourceBucket
          - Name: LZA_SYNTH_ROLE_ARN
            Value: !GetAtt LZAValidatorSynthRole.Arn
          - Name: AWS_PARTITION
            Value: !Ref 'AWS::Partition'
          - Name: NODE_OPTIONS
            Value: '--max-old-space-size=4096'
      Source:
        Type: S3
        Location: !Sub '${PRValidationBucket}/default.zip'
        BuildSpec: buildspec.yml
      TimeoutInMinutes: 20

  GitHubActionsUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Ref pGitHubActionsUserName
      Policies:
        - PolicyName: S3UploadAndCodeBuildInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub '${PRValidationBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                  - logs:GetLogEvents
                Resource:
                  - !GetAtt LZAValidationProject.Arn
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${pValidationProjectName}:*'

  LZASourceBuilderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref pSourceBuilderRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LZASourceBuilderPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3WriteSource
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub '${LZASourceBucket.Arn}'
                  - !Sub '${LZASourceBucket.Arn}/*'
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${pSourceBuilderProjectName}:*'

  LZASourceBuilderProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Ref pSourceBuilderProjectName
      Description: 'Builds pre-compiled LZA source tar and uploads to S3. Run manually when LZA version changes.'
      ServiceRole: !GetAtt LZASourceBuilderRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: !Ref pSourceBuilderComputeType
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: LZA_VERSION
            Value: !Ref pLZAVersion
          - Name: LZA_SOURCE_BUCKET
            Value: !Ref LZASourceBucket
          - Name: NODE_OPTIONS
            Value: '--max-old-space-size=8192'
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                nodejs: 22
              commands:
                - npm install --global yarn
            build:
              commands:
                - echo "Downloading LZA ${LZA_VERSION} source from S3..."
                - mkdir -p /tmp/lza-source
                - aws s3 cp s3://${LZA_SOURCE_BUCKET}/lza-${LZA_VERSION}-src.tar.gz - | tar -xz -C /tmp/lza-source
                - cd /tmp/lza-source/source
                - echo "Installing dependencies..."
                - yarn install --frozen-lockfile
                - echo "Building all packages..."
                - yarn build
                - echo "Creating prebuilt tar..."
                - cd /tmp/lza-source
                - tar -czf /tmp/lza-${LZA_VERSION}.tar.gz --exclude=.git .
                - ls -lh /tmp/lza-${LZA_VERSION}.tar.gz
                - echo "Uploading to s3://${LZA_SOURCE_BUCKET}/lza-${LZA_VERSION}.tar.gz"
                - aws s3 cp /tmp/lza-${LZA_VERSION}.tar.gz s3://${LZA_SOURCE_BUCKET}/lza-${LZA_VERSION}.tar.gz
                - echo "Done! Pre-built LZA ${LZA_VERSION} uploaded."
      TimeoutInMinutes: 30

  GitHubActionsAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref GitHubActionsUser

  GitHubActionsCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Ref pCredentialsSecretName
      Description: 'GitHub Actions IAM user credentials for the LZA PR validator. Consume these to set repository secrets.'
      SecretString: !Sub '{"AWS_ACCESS_KEY_ID":"${GitHubActionsAccessKey}","AWS_SECRET_ACCESS_KEY":"${GitHubActionsAccessKey.SecretAccessKey}"}'

Outputs:
  ValidationS3BucketName:
    Description: 'S3 bucket that receives PR config zips'
    Value: !Ref PRValidationBucket
  LZASourceBucketName:
    Description: 'S3 bucket holding LZA source bundles'
    Value: !Ref LZASourceBucket
  CodeBuildProjectName:
    Description: 'Validation CodeBuild project name'
    Value: !Ref LZAValidationProject
  SourceBuilderProjectName:
    Description: 'Source builder CodeBuild project name'
    Value: !Ref LZASourceBuilderProject
  CredentialsSecretArn:
    Description: 'Secrets Manager secret ARN holding the GitHub Actions access key and secret (JSON: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)'
    Value: !Ref GitHubActionsCredentialsSecret
  CredentialsSecretName:
    Description: 'Secrets Manager secret name'
    Value: !Ref pCredentialsSecretName
  RetrieveCredentialsCommand:
    Description: 'CLI command to retrieve the GitHub Actions credentials'
    Value: !Sub 'aws secretsmanager get-secret-value --secret-id ${pCredentialsSecretName} --query SecretString --output text'
