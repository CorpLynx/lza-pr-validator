AWSTemplateFormatVersion: '2010-09-09'
Description: 'S3 + CodeBuild validation engine with caching for LZA PR checks'

Parameters:
  LZAVersion:
    Type: String
    Default: 'v1.16.0'
    Description: 'Release tag of awslabs/landing-zone-accelerator-on-aws to validate against'

Resources:
  PRValidationBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: CleanUpOldPrZips
            Status: Enabled
            ExpirationInDays: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  PRValidationBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PRValidationBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceTLSRequestsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub '${PRValidationBucket.Arn}'
              - !Sub '${PRValidationBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  LZASourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  LZASourceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LZASourceBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceTLSRequestsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub '${LZASourceBucket.Arn}'
              - !Sub '${LZASourceBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  CodeBuildValidatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: LZA-PR-Validator-CodeBuild-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LZAValidatorPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub '${PRValidationBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                Resource:
                  - !Sub '${LZASourceBucket.Arn}'
                  - !Sub '${LZASourceBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'
              - Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/LZA-PR-Validator-Synth-Role'

  LZAValidatorSynthRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: LZA-PR-Validator-Synth-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/LZA-PR-Validator-CodeBuild-Role'
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LZASynthPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: OrganizationsReadOnly
                Effect: Allow
                Action:
                  - organizations:ListAccounts
                  - organizations:DescribeOrganization
                  - organizations:DescribeAccount
                  - organizations:ListRoots
                  - organizations:ListOrganizationalUnitsForParent
                  - organizations:ListChildren
                  - organizations:ListAccountsForParent
                Resource: '*'
              - Sid: DynamoDBConfigTable
                Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:GetItem
                  - dynamodb:DescribeTable
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/AWSAccelerator-*'
              - Sid: SSMParameterRead
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/accelerator/*'
                  - !Sub 'arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/cdk-bootstrap/*'
              - Sid: KMSDecrypt
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:GenerateDataKey
                Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
              - Sid: STSIdentity
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: '*'
              - Sid: EC2DescribeRegions
                Effect: Allow
                Action:
                  - ec2:DescribeRegions
                  - ec2:DescribeAvailabilityZones
                Resource: '*'
              - Sid: CrossAccountAccess
                Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::*:role/AWSControlTowerExecution'

  LZAValidationProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: LZA-PR-Validator
      Description: 'Validates LZA PR configs from S3 archive using yamllint, validate-config, and concurrent cdk synth'
      ServiceRole: !GetAtt CodeBuildValidatorRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Cache:
        Type: LOCAL
        Modes:
          - LOCAL_SOURCE_CACHE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE  # 8 vCPUs, 15 GB RAM
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: LZA_VERSION
            Value: !Ref LZAVersion
          - Name: LZA_SOURCE_BUCKET
            Value: !Ref LZASourceBucket
          - Name: LZA_SYNTH_ROLE_ARN
            Value: !GetAtt LZAValidatorSynthRole.Arn
          - Name: AWS_PARTITION
            Value: !Ref 'AWS::Partition'
          - Name: NODE_OPTIONS
            Value: '--max-old-space-size=4096'
      Source:
        Type: S3
        Location: !Sub '${PRValidationBucket}/default.zip'
        BuildSpec: buildspec.yml
      TimeoutInMinutes: 20

  GitHubActionsUser:
    Type: AWS::IAM::User
    Properties:
      UserName: GHA-LZA-PR-Validator-User
      Policies:
        - PolicyName: S3UploadAndCodeBuildInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub '${PRValidationBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                  - logs:GetLogEvents
                Resource:
                  - !GetAtt LZAValidationProject.Arn
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/LZA-PR-Validator:*'

  LZASourceBuilderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: LZA-Source-Builder-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LZASourceBuilderPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3WriteSource
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub '${LZASourceBucket.Arn}'
                  - !Sub '${LZASourceBucket.Arn}/*'
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/LZA-Source-Builder:*'

  LZASourceBuilderProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: LZA-Source-Builder
      Description: 'Builds pre-compiled LZA source tar and uploads to S3. Run manually when LZA version changes.'
      ServiceRole: !GetAtt LZASourceBuilderRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: LZA_VERSION
            Value: !Ref LZAVersion
          - Name: LZA_SOURCE_BUCKET
            Value: !Ref LZASourceBucket
          - Name: NODE_OPTIONS
            Value: '--max-old-space-size=8192'
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                nodejs: 22
              commands:
                - npm install --global yarn
            build:
              commands:
                - echo "Cloning LZA ${LZA_VERSION} source..."
                - git clone --depth 1 --branch "release/${LZA_VERSION}" https://github.com/awslabs/landing-zone-accelerator-on-aws.git /tmp/lza-source
                - cd /tmp/lza-source/source
                - echo "Installing dependencies..."
                - yarn install --frozen-lockfile
                - echo "Building all packages..."
                - yarn build
                - echo "Creating prebuilt tar..."
                - cd /tmp/lza-source
                - tar -czf /tmp/lza-${LZA_VERSION}.tar.gz --exclude=.git .
                - ls -lh /tmp/lza-${LZA_VERSION}.tar.gz
                - echo "Uploading to s3://${LZA_SOURCE_BUCKET}/lza-${LZA_VERSION}.tar.gz"
                - aws s3 cp /tmp/lza-${LZA_VERSION}.tar.gz s3://${LZA_SOURCE_BUCKET}/lza-${LZA_VERSION}.tar.gz
                - echo "Done! Pre-built LZA ${LZA_VERSION} uploaded."
      TimeoutInMinutes: 30

  GitHubActionsAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref GitHubActionsUser

Outputs:
  ValidationS3BucketName:
    Value: !Ref PRValidationBucket
  LZASourceBucketName:
    Value: !Ref LZASourceBucket
  GitHubActionsAccessKeyId:
    Value: !Ref GitHubActionsAccessKey
  GitHubActionsSecretAccessKey:
    Value: !GetAtt GitHubActionsAccessKey.SecretAccessKey
  CodeBuildProjectName:
    Value: !Ref LZAValidationProject
  SourceBuilderProjectName:
    Value: !Ref LZASourceBuilderProject
