version: 0.2

# LZA Config Validator buildspec.
# Thin by design - all validation logic lives in scripts/validate-config-pr.sh,
# mirroring how LZA factors pipeline logic into scripts/prepare-stage.sh.
# ACCELERATOR_* environment variables are injected by the CodeBuild project.

phases:
  install:
    runtime-versions:
      nodejs: 22
      python: 3.11
    commands:
      - command -v yamllint >/dev/null 2>&1 || pip install --quiet yamllint
      - command -v yarn >/dev/null 2>&1 || npm install --global yarn
      - chmod +x ./scripts/validate-config-pr.sh
  build:
    commands:
      - ./scripts/validate-config-pr.sh "$CODEBUILD_SRC_DIR"

cache:
  paths:
    - '/root/.cache/yarn/**/*'
